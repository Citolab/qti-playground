<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-label="A red and white lighthouse on the rocks at dusk, shining its beam across the sea while a seagull flies towards it">
  <title>The lighthouse at Gullstone Point</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6f78"/>
      <stop offset="0.55" stop-color="#7fd3c4"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8fa0"/>
      <stop offset="1" stop-color="#0d5c6e"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff4b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4b8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="360" height="300" rx="22"/></clipPath>
    <clipPath id="tower"><path d="M220 110 L260 110 L272 240 L208 240 Z"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="360" height="300" fill="url(#sky)"/>
    <!-- evening stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="26" r="1.4" opacity="0.8"/>
      <circle cx="120" cy="16" r="1.1" opacity="0.7"/>
      <circle cx="320" cy="30" r="1.4" opacity="0.8"/>
      <circle cx="190" cy="40" r="1" opacity="0.6"/>
    </g>
    <!-- low sun -->
    <circle cx="80" cy="236" r="34" fill="#ffd56b"/>
    <circle cx="80" cy="236" r="48" fill="#ffd56b" opacity="0.25"/>
    <!-- clouds -->
    <g fill="#ffffff" opacity="0.75">
      <path d="M24 92 C24 82 38 78 44 84 C48 74 66 74 70 86 C80 84 86 92 80 98 H28 C22 98 22 94 24 92 Z"/>
      <path d="M286 64 C286 56 298 52 302 58 C306 50 320 50 324 60 C332 58 338 66 332 70 H290 C284 70 284 66 286 64 Z"/>
    </g>

    <!-- beam of light -->
    <polygon points="240,80 0,30 0,136 240,96" fill="url(#beam)"/>

    <!-- sea -->
    <rect x="0" y="236" width="360" height="64" fill="url(#sea)"/>
    <rect x="40" y="238" width="80" height="4" rx="2" fill="#ffe6a3" opacity="0.7"/>
    <rect x="56" y="248" width="48" height="3" rx="1.5" fill="#ffe6a3" opacity="0.5"/>
    <g fill="none" stroke="#bdeee8" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M20 270 q10 -8 20 0 t20 0"/>
      <path d="M120 284 q10 -8 20 0 t20 0"/>
      <path d="M300 276 q10 -8 20 0 t20 0"/>
      <path d="M150 258 q8 -6 16 0 t16 0"/>
    </g>

    <!-- rocks -->
    <path d="M168 262 C170 238 192 226 214 232 C226 220 254 220 266 232 C286 226 312 236 316 262 Z" fill="#4f5d63"/>
    <path d="M190 262 C194 248 210 242 222 246 C232 238 250 240 258 250 C274 246 290 252 292 262 Z" fill="#6c7d84"/>

    <!-- tower -->
    <path d="M220 110 L260 110 L272 240 L208 240 Z" fill="#ffffff"/>
    <g clip-path="url(#tower)">
      <rect x="200" y="138" width="80" height="26" fill="#e04b3a"/>
      <rect x="200" y="194" width="80" height="26" fill="#e04b3a"/>
      <rect x="248" y="100" width="30" height="150" fill="#000000" opacity="0.08"/>
    </g>
    <rect x="236" y="170" width="8" height="14" rx="4" fill="#004119"/>
    <path d="M232 240 V228 A8 8 0 0 1 248 228 V240 Z" fill="#004119"/>
    <!-- gallery and lamp room -->
    <rect x="210" y="102" width="60" height="10" rx="2" fill="#004119"/>
    <rect x="222" y="74" width="36" height="28" fill="#fff3b0"/>
    <circle cx="240" cy="88" r="9" fill="#f6c900"/>
    <g stroke="#004119" stroke-width="3">
      <line x1="222" y1="74" x2="222" y2="102"/>
      <line x1="240" y1="74" x2="240" y2="102"/>
      <line x1="258" y1="74" x2="258" y2="102"/>
    </g>
    <path d="M216 75 L264 75 L240 52 Z" fill="#004119"/>
    <circle cx="240" cy="50" r="4" fill="#004119"/>

    <!-- the gull -->
    <g transform="translate(96 168) scale(1.1)">
      <path d="M-26 -6 C-16 -18 -6 -14 0 -2 C6 -14 16 -18 26 -6 C16 -10 8 -6 0 4 C-8 -6 -16 -10 -26 -6 Z" fill="#ffffff"/>
      <path d="M-26 -6 C-22 -10 -18 -11 -16 -10 L-20 -6 Z" fill="#37474f"/>
      <path d="M26 -6 C22 -10 18 -11 16 -10 L20 -6 Z" fill="#37474f"/>
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="#ffffff"/>
      <path d="M5 -1 L11 0 L5 2 Z" fill="#f6c900"/>
    </g>
  </g>
</svg>
