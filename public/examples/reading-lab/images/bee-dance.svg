<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220" role="img" aria-label="A honeybee on a honeycomb, dancing the waggle dance along a dotted figure-of-eight path">
  <title>The waggle dance</title>
  <defs>
    <pattern id="comb" width="36" height="62.35" patternUnits="userSpaceOnUse" patternTransform="translate(4 0)">
      <path d="M18 0 L36 10.4 L36 31.2 L18 41.6 L0 31.2 L0 10.4 Z M18 41.6 L18 62.35 M0 52 L18 62.35 L36 52" fill="none" stroke="#e8b800" stroke-width="2" opacity="0.55"/>
    </pattern>
    <clipPath id="frame"><rect width="320" height="220" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="320" height="220" fill="#fff6cc"/>
    <rect width="320" height="220" fill="url(#comb)"/>
    <!-- a few cells filled with honey -->
    <g fill="#f6c900" opacity="0.55">
      <path d="M40 10.4 L58 0 L76 10.4 L76 31.2 L58 41.6 L40 31.2 Z"/>
      <path d="M256 52 L274 41.6 L292 52 L292 72.8 L274 83.2 L256 72.8 Z"/>
      <path d="M22 145 L40 134.6 L58 145 L58 165.8 L40 176.2 L22 165.8 Z"/>
      <path d="M274 166 L292 155.6 L310 166 L310 186.8 L292 197.2 L274 186.8 Z"/>
    </g>
  </g>

  <!-- the Sun, and the direction the dance points to -->
  <circle cx="276" cy="34" r="16" fill="#ffffff"/>
  <circle cx="276" cy="34" r="11" fill="#f6c900"/>
  <g stroke="#f6c900" stroke-width="3" stroke-linecap="round">
    <path d="M276 12 V8"/><path d="M276 60 V56"/><path d="M254 34 H250"/><path d="M302 34 H298"/>
    <path d="M261 19 L258 16"/><path d="M291 49 L294 52"/><path d="M291 19 L294 16"/><path d="M261 49 L258 52"/>
  </g>

  <!-- figure-of-eight path: straight waggle run with a loop on each side -->
  <g fill="none" stroke-linecap="round">
    <path d="M118 168 L196 60 C230 70 236 120 204 150 C186 166 150 172 118 168 Z" stroke="#00a748" stroke-width="3" stroke-dasharray="2 9" opacity="0.9"/>
    <path d="M118 168 L196 60 C150 40 104 70 98 110 C94 140 104 162 118 168 Z" stroke="#00b1a9" stroke-width="3" stroke-dasharray="2 9" opacity="0.9"/>
    <!-- wiggle along the straight run -->
    <path d="M128 154 l10 2 l-2 -10 l10 2 l-2 -10 l10 2 l-2 -10 l10 2 l-2 -10 l10 2 l-2 -10 l10 2" stroke="#004119" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <!-- arrow at the end of the run -->
  <path d="M196 60 l-14 4 l8 9 Z" fill="#004119"/>

  <!-- the bee, heading up the run -->
  <g transform="translate(150 118) rotate(36)">
    <ellipse cx="-14" cy="-10" rx="15" ry="9" fill="#ffffff" stroke="#9ec9c6" stroke-width="1.5" opacity="0.95" transform="rotate(-25 -14 -10)"/>
    <ellipse cx="14" cy="-10" rx="15" ry="9" fill="#ffffff" stroke="#9ec9c6" stroke-width="1.5" opacity="0.95" transform="rotate(25 14 -10)"/>
    <ellipse cx="0" cy="6" rx="15" ry="22" fill="#f6c900" stroke="#3b2f00" stroke-width="2"/>
    <path d="M-14 0 H14 M-14.5 10 H14.5 M-11 20 H11" stroke="#3b2f00" stroke-width="5"/>
    <circle cx="0" cy="-20" r="10" fill="#3b2f00"/>
    <circle cx="-4" cy="-23" r="2.2" fill="#ffffff"/>
    <circle cx="4" cy="-23" r="2.2" fill="#ffffff"/>
    <path d="M-4 -29 C-8 -38 -12 -40 -15 -40 M4 -29 C8 -38 12 -40 15 -40" stroke="#3b2f00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M0 28 L0 34" stroke="#3b2f00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- motion marks -->
  <g stroke="#004119" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M118 108 l-8 -3"/><path d="M116 120 l-9 0"/><path d="M182 128 l8 3"/><path d="M180 140 l9 1"/>
  </g>

  <!-- a lavender sprig for the flowers the dance is about -->
  <g transform="translate(36 70)">
    <path d="M0 60 C2 40 4 20 8 0" stroke="#00742f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g fill="#8e6cc8">
      <ellipse cx="8" cy="2" rx="4" ry="6"/>
      <ellipse cx="3" cy="12" rx="4" ry="6"/>
      <ellipse cx="11" cy="14" rx="4" ry="6"/>
      <ellipse cx="4" cy="25" rx="4" ry="6"/>
      <ellipse cx="11" cy="27" rx="4" ry="6"/>
    </g>
  </g>
</svg>
