<svg xmlns="http://www.w3.org/2000/svg" width="260" height="220" viewBox="0 0 260 220" role="img" aria-label="A young seagull with a little bandage on its wing, sitting snugly on a striped towel inside an old biscuit tin">
  <title>Pebble the gull in her biscuit tin</title>
  <rect width="260" height="220" rx="22" fill="#e6f6f5"/>
  <circle cx="200" cy="50" r="22" fill="#ffffff" opacity="0.7"/>
  <circle cx="60" cy="60" r="14" fill="#ffffff" opacity="0.7"/>

  <!-- tin body (back) -->
  <ellipse cx="128" cy="196" rx="86" ry="14" fill="#004119" opacity="0.15"/>
  <path d="M44 150 V184 A84 18 0 0 0 212 184 V150 Z" fill="#00b1a9"/>
  <g fill="#f6c900">
    <circle cx="66" cy="176" r="5"/>
    <circle cx="98" cy="186" r="5"/>
    <circle cx="132" cy="189" r="5"/>
    <circle cx="166" cy="186" r="5"/>
    <circle cx="196" cy="176" r="5"/>
  </g>
  <ellipse cx="128" cy="150" rx="84" ry="18" fill="#008f88"/>

  <!-- towel -->
  <path d="M50 150 C58 128 82 136 92 132 C110 126 150 126 166 132 C182 136 202 128 208 150 C190 162 66 162 50 150 Z" fill="#fff3d6"/>
  <path d="M60 146 C80 140 100 142 108 140" stroke="#00a748" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M150 140 C162 142 180 140 198 146" stroke="#00a748" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- gull body -->
  <ellipse cx="124" cy="118" rx="46" ry="32" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <path d="M78 112 L58 104 L66 120 Z" fill="#b0bec5"/>
  <!-- wing with plaster -->
  <g transform="rotate(-12 112 120)">
    <ellipse cx="112" cy="122" rx="34" ry="17" fill="#b0bec5"/>
    <path d="M80 118 C84 112 92 112 96 116 L90 126 C86 126 82 124 80 118 Z" fill="#37474f"/>
    <rect x="106" y="108" width="12" height="30" rx="4" fill="#f3d2a4" transform="rotate(30 112 123)"/>
    <g fill="#d9b07c" transform="rotate(30 112 123)">
      <circle cx="110" cy="118" r="1.2"/>
      <circle cx="114" cy="118" r="1.2"/>
      <circle cx="110" cy="128" r="1.2"/>
      <circle cx="114" cy="128" r="1.2"/>
    </g>
  </g>
  <!-- head -->
  <circle cx="160" cy="84" r="25" fill="#ffffff" stroke="#cfd8dc" stroke-width="2"/>
  <circle cx="167" cy="79" r="4.5" fill="#1b1b1b"/>
  <circle cx="168.5" cy="77.5" r="1.5" fill="#ffffff"/>
  <path d="M182 84 L206 90 L182 96 Z" fill="#f6c900"/>
  <circle cx="196" cy="91" r="2.2" fill="#e04b3a"/>
  <ellipse cx="160" cy="96" rx="6" ry="3" fill="#ffd6d0" opacity="0.8"/>
</svg>
