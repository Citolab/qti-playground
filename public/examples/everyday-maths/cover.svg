<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="A pizza with a slice taken out, a graph, a ruler, a protractor and maths symbols on green squared paper">
  <title>Everyday Maths</title>
  <style>
    .grid { animation: drift 8s linear infinite; }
    .slice { animation: slide 4s ease-in-out infinite alternate; }
    .float { animation: float 5s ease-in-out infinite alternate; }
    .float-2 { animation-duration: 6.5s; animation-delay: -2s; }
    .float-3 { animation-duration: 4.4s; animation-delay: -3.2s; }
    .float-4 { animation-duration: 5.8s; animation-delay: -1s; }
    .graph-line { animation: draw 7s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pop 7s ease-out infinite; }
    .dot:nth-child(2) { animation-delay: 0.25s; }
    .dot:nth-child(3) { animation-delay: 0.5s; }
    .dot:nth-child(4) { animation-delay: 0.75s; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(40px, 40px); } }
    @keyframes slide { from { transform: translateX(-10px); } to { transform: translateX(12px); } }
    @keyframes float { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
    @keyframes draw { 0% { stroke-dashoffset: 1; } 30%, 100% { stroke-dashoffset: 0; } }
    @keyframes pop { 0%, 18% { transform: scale(0); } 26% { transform: scale(1.3); } 32%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b85a"/>
      <stop offset="1" stop-color="#00913f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g class="grid"><rect x="-40" y="-40" width="880" height="530" fill="url(#grid)"/></g>

  <!-- protractor (behind the pizza) -->
  <g transform="translate(150 410)">
    <path d="M-130 0 A130 130 0 0 1 130 0 Z" fill="#00b1a9" opacity="0.9"/>
    <path d="M-60 0 A60 60 0 0 1 60 0 Z" fill="#00a748"/>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="-130" y1="0" x2="-112" y2="0"/>
      <line x1="-112.6" y1="-65" x2="-97" y2="-56"/>
      <line x1="-65" y1="-112.6" x2="-56" y2="-97"/>
      <line x1="0" y1="-130" x2="0" y2="-112"/>
      <line x1="65" y1="-112.6" x2="56" y2="-97"/>
      <line x1="112.6" y1="-65" x2="97" y2="-56"/>
      <line x1="130" y1="0" x2="112" y2="0"/>
    </g>
  </g>

  <!-- pizza: centre (270,215), radius 150, one eighth removed -->
  <circle cx="276" cy="226" r="152" fill="#004119" opacity="0.18"/>
  <path d="M270 215 L408.58 272.40 A150 150 0 1 1 408.58 157.60 Z" fill="#e2a04a"/>
  <path d="M270 215 L388.26 263.99 A128 128 0 1 1 388.26 166.01 Z" fill="#ffd84d"/>
  <g fill="#d9472b">
    <circle cx="210" cy="150" r="18"/>
    <circle cx="190" cy="250" r="18"/>
    <circle cx="276" cy="300" r="17"/>
    <circle cx="300" cy="120" r="16"/>
    <circle cx="246" cy="214" r="16"/>
    <circle cx="170" cy="200" r="11"/>
  </g>
  <g fill="#c13a20" opacity="0.5">
    <circle cx="214" cy="146" r="5"/>
    <circle cx="194" cy="246" r="5"/>
    <circle cx="280" cy="296" r="5"/>
  </g>
  <g fill="#00a748">
    <ellipse cx="244" cy="124" rx="12" ry="6" transform="rotate(-30 244 124)"/>
    <ellipse cx="150" cy="240" rx="12" ry="6" transform="rotate(40 150 240)"/>
    <ellipse cx="326" cy="270" rx="12" ry="6" transform="rotate(10 326 270)"/>
    <ellipse cx="226" cy="300" rx="11" ry="5" transform="rotate(-50 226 300)"/>
  </g>
  <!-- the slice, pulled out -->
  <g class="slice">
  <g transform="translate(36 0)">
    <path d="M270 215 L408.58 157.60 A150 150 0 0 1 408.58 272.40 Z" fill="#004119" opacity="0.18" transform="translate(6 10)"/>
    <path d="M270 215 L408.58 157.60 A150 150 0 0 1 408.58 272.40 Z" fill="#e2a04a"/>
    <path d="M270 215 L388.26 166.01 A128 128 0 0 1 388.26 263.99 Z" fill="#ffd84d"/>
    <circle cx="350" cy="215" r="15" fill="#d9472b"/>
    <ellipse cx="318" cy="200" rx="10" ry="5" fill="#00a748"/>
  </g>
  </g>

  <!-- graph card -->
  <g transform="rotate(5 640 130)">
    <rect x="530" y="40" width="220" height="170" rx="16" fill="#ffffff"/>
    <g stroke="#d7e3dc" stroke-width="2">
      <line x1="560" y1="70" x2="560" y2="180"/>
      <line x1="600" y1="70" x2="600" y2="180"/>
      <line x1="640" y1="70" x2="640" y2="180"/>
      <line x1="680" y1="70" x2="680" y2="180"/>
      <line x1="720" y1="70" x2="720" y2="180"/>
      <line x1="560" y1="80" x2="725" y2="80"/>
      <line x1="560" y1="113" x2="725" y2="113"/>
      <line x1="560" y1="146" x2="725" y2="146"/>
    </g>
    <path d="M560 180 H728 M560 180 V64" stroke="#004119" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polyline class="graph-line" pathLength="1" stroke-dasharray="1" points="560,170 600,150 640,156 680,110 720,86" fill="none" stroke="#00b1a9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#f6c900" stroke="#004119" stroke-width="3">
      <circle class="dot" cx="600" cy="150" r="7"/>
      <circle class="dot" cx="640" cy="156" r="7"/>
      <circle class="dot" cx="680" cy="110" r="7"/>
      <circle class="dot" cx="720" cy="86" r="7"/>
    </g>
  </g>

  <!-- ruler -->
  <g transform="rotate(-12 620 360)">
    <rect x="470" y="330" width="320" height="56" rx="8" fill="#f6c900"/>
    <g stroke="#004119" stroke-width="3" stroke-linecap="round">
      <line x1="490" y1="330" x2="490" y2="356"/>
      <line x1="514" y1="330" x2="514" y2="344"/>
      <line x1="538" y1="330" x2="538" y2="356"/>
      <line x1="562" y1="330" x2="562" y2="344"/>
      <line x1="586" y1="330" x2="586" y2="356"/>
      <line x1="610" y1="330" x2="610" y2="344"/>
      <line x1="634" y1="330" x2="634" y2="356"/>
      <line x1="658" y1="330" x2="658" y2="344"/>
      <line x1="682" y1="330" x2="682" y2="356"/>
      <line x1="706" y1="330" x2="706" y2="344"/>
      <line x1="730" y1="330" x2="730" y2="356"/>
      <line x1="754" y1="330" x2="754" y2="344"/>
    </g>
  </g>

  <!-- symbol tiles -->
  <g font-family="Verdana, Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle">
    <g class="float"><g transform="rotate(-8 470 80)">
      <rect x="438" y="48" width="64" height="64" rx="14" fill="#004119"/>
      <text x="470" y="94" fill="#ffffff">+</text>
    </g></g>
    <g class="float float-2"><g transform="translate(28 4) rotate(10 486 238)">
      <rect x="456" y="208" width="60" height="60" rx="14" fill="#ffffff"/>
      <text x="486" y="252" fill="#00a748">&#247;</text>
    </g></g>
    <g class="float float-3"><g transform="rotate(-6 72 70)">
      <rect x="40" y="38" width="64" height="64" rx="14" fill="#f6c900"/>
      <text x="72" y="84" fill="#004119">&#215;</text>
    </g></g>
    <g class="float float-4"><g transform="translate(-120 -10) rotate(8 740 270)">
      <rect x="712" y="242" width="56" height="56" rx="14" fill="#004119"/>
      <text x="740" y="284" fill="#f6c900">=</text>
    </g></g>
  </g>
</svg>
