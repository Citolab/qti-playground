<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" role="img" aria-label="A treasure map drawn on a coordinate grid. The x-axis and the y-axis both run from 0 to 6.">
  <title>Treasure map on a coordinate grid</title>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b4f24"/>
    </marker>
  </defs>
  <!-- parchment -->
  <rect x="4" y="4" width="452" height="392" rx="20" fill="#f8f0dc" stroke="#e2cfa3" stroke-width="3"/>

  <!-- grid: origin at (50,350), one unit = 50 px -->
  <g stroke="#dcc79a" stroke-width="1.5">
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="250" y1="50" x2="250" y2="350"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
    <line x1="350" y1="50" x2="350" y2="350"/>
    <line x1="50" y1="300" x2="350" y2="300"/>
    <line x1="50" y1="250" x2="350" y2="250"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="150" x2="350" y2="150"/>
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="50" x2="350" y2="50"/>
  </g>

  <!-- axes -->
  <g stroke="#6b4f24" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="350" x2="372" y2="350" marker-end="url(#axis-arrow)"/>
    <line x1="50" y1="350" x2="50" y2="28" marker-end="url(#axis-arrow)"/>
  </g>
  <g font-family="Verdana, Arial, sans-serif" font-size="14" fill="#6b4f24" text-anchor="middle">
    <text x="50" y="372">0</text>
    <text x="100" y="372">1</text>
    <text x="150" y="372">2</text>
    <text x="200" y="372">3</text>
    <text x="250" y="372">4</text>
    <text x="300" y="372">5</text>
    <text x="350" y="372">6</text>
    <text x="34" y="305">1</text>
    <text x="34" y="255">2</text>
    <text x="34" y="205">3</text>
    <text x="34" y="155">4</text>
    <text x="34" y="105">5</text>
    <text x="34" y="55">6</text>
    <text x="388" y="355" font-style="italic" font-size="16">x</text>
    <text x="50" y="20" font-style="italic" font-size="16">y</text>
  </g>

  <!-- palm tree on a little sandy island (top left) -->
  <ellipse cx="112" cy="122" rx="34" ry="9" fill="#efd38d"/>
  <path d="M110 120 C112 104 108 92 114 80" fill="none" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
  <g fill="#00a748">
    <path d="M114 80 C100 70 88 74 82 84 C94 78 104 80 114 80 Z"/>
    <path d="M114 80 C126 68 140 72 146 82 C134 76 124 78 114 80 Z"/>
    <path d="M114 80 C110 66 118 58 128 58 C120 64 116 70 114 80 Z"/>
    <path d="M114 80 C104 72 98 62 100 56 C106 64 110 70 114 80 Z"/>
  </g>
  <circle cx="112" cy="84" r="3" fill="#8a5a2b"/>
  <circle cx="118" cy="85" r="3" fill="#8a5a2b"/>

  <!-- rocks (bottom right) -->
  <path d="M286 300 C288 290 300 286 308 292 C316 286 326 292 324 302 Z" fill="#a39a8a"/>
  <path d="M296 296 C298 292 304 292 306 296" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- compass rose -->
  <g transform="translate(414 92)">
    <circle r="32" fill="#ffffff" stroke="#dcc79a" stroke-width="2"/>
    <path d="M0 -26 L6 -6 L0 0 Z" fill="#004119"/>
    <path d="M0 -26 L-6 -6 L0 0 Z" fill="#00a748"/>
    <path d="M0 26 L6 6 L0 0 Z" fill="#00a748"/>
    <path d="M0 26 L-6 6 L0 0 Z" fill="#004119"/>
    <path d="M26 0 L6 6 L0 0 Z" fill="#004119"/>
    <path d="M26 0 L6 -6 L0 0 Z" fill="#00a748"/>
    <path d="M-26 0 L-6 -6 L0 0 Z" fill="#004119"/>
    <path d="M-26 0 L-6 6 L0 0 Z" fill="#00a748"/>
    <circle r="3" fill="#f6c900"/>
    <text y="-38" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#004119" text-anchor="middle">N</text>
  </g>

  <!-- little ship -->
  <g transform="translate(414 250)">
    <path d="M-30 10 L30 10 L22 26 L-22 26 Z" fill="#8a5a2b"/>
    <line x1="0" y1="10" x2="0" y2="-34" stroke="#6b4f24" stroke-width="3"/>
    <path d="M2 -30 L26 4 L2 4 Z" fill="#ffffff" stroke="#dcc79a" stroke-width="1.5"/>
    <path d="M-2 -24 L-22 4 L-2 4 Z" fill="#ffffff" stroke="#dcc79a" stroke-width="1.5"/>
    <path d="M0 -34 L14 -30 L0 -26 Z" fill="#00a748"/>
    <path d="M-40 32 Q-30 26 -20 32 T0 32 T20 32 T40 32" fill="none" stroke="#00b1a9" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
