<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img" aria-label="Two cinema tickets and a striped box of popcorn">
  <title>Cinema tickets and popcorn</title>
  <rect width="360" height="180" rx="22" fill="#e6f6ec"/>
  <!-- ticket 1 -->
  <g transform="rotate(-9 110 96)">
    <path d="M30 56 H190 V82 A14 14 0 0 0 190 110 V136 H30 V110 A14 14 0 0 0 30 82 Z" fill="#00a748"/>
    <line x1="150" y1="60" x2="150" y2="132" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M90 74 L96 88 L111 89 L99 98 L103 113 L90 105 L77 113 L81 98 L69 89 L84 88 Z" fill="#f6c900"/>
    <rect x="158" y="76" width="22" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="158" y="90" width="16" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
    <rect x="158" y="104" width="22" height="6" rx="3" fill="#ffffff" opacity="0.7"/>
  </g>
  <!-- ticket 2 -->
  <g transform="rotate(7 150 104)">
