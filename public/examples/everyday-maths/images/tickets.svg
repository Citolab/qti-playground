    <line x1="190" y1="68" x2="190" y2="140" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M130 82 L136 96 L151 97 L139 106 L143 121 L130 113 L117 121 L121 106 L109 97 L124 96 Z" fill="#004119"/>
    <rect x="198" y="84" width="22" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="198" y="98" width="16" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="198" y="112" width="22" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- popcorn -->
  <g transform="translate(296 0)">
    <g fill="#fff4cf" stroke="#f6c900" stroke-width="2">
      <circle cx="-22" cy="66" r="13"/>
      <circle cx="-4" cy="56" r="14"/>
      <circle cx="16" cy="60" r="13"/>
      <circle cx="30" cy="72" r="11"/>
      <circle cx="-32" cy="78" r="10"/>
      <circle cx="4" cy="72" r="12"/>
    </g>
    <path d="M-40 78 H40 L32 160 H-32 Z" fill="#ffffff"/>
    <path d="M-40 78 H-24 L-20 160 H-32 Z" fill="#e04b3a"/>
    <path d="M-8 78 H8 L6 160 H-6 Z" fill="#e04b3a"/>
    <path d="M24 78 H40 L32 160 H20 Z" fill="#e04b3a"/>
