<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" role="img" aria-label="A measuring jug with four equal markings, filled with orange juice up to the third marking">
  <title>A measuring jug filled to three of its four markings</title>
  <defs>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb21e"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
    <clipPath id="inside"><path d="M62 50 L178 50 L168 222 Q168 226 164 226 L76 226 Q72 226 72 222 Z"/></clipPath>
  </defs>
  <rect width="240" height="260" rx="22" fill="#eef8f2"/>
  <ellipse cx="120" cy="236" rx="78" ry="8" fill="#004119" opacity="0.12"/>

  <!-- handle -->
  <path d="M176 78 C214 80 216 160 172 168" fill="none" stroke="#004119" stroke-width="12" stroke-linecap="round"/>
  <path d="M176 78 C214 80 216 160 172 168" fill="none" stroke="#e8f4ee" stroke-width="5" stroke-linecap="round"/>

  <!-- glass -->
  <path d="M62 50 L178 50 L168 222 Q168 226 164 226 L76 226 Q72 226 72 222 Z" fill="#ffffff" opacity="0.85"/>
  <g clip-path="url(#inside)">
    <rect x="50" y="101" width="140" height="140" fill="url(#juice)"/>
    <ellipse cx="120" cy="101" rx="66" ry="3.5" fill="#ffd36b"/>
    <circle cx="96" cy="150" r="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="140" cy="186" r="2.4" fill="#ffffff" opacity="0.5"/>
    <circle cx="118" cy="122" r="2" fill="#ffffff" opacity="0.5"/>
    <!-- shine -->
    <rect x="150" y="40" width="8" height="200" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- spout and rim -->
  <path d="M62 50 L44 40 L60 62" fill="#ffffff" stroke="#004119" stroke-width="5" stroke-linejoin="round"/>
  <path d="M62 50 L178 50 L168 222 Q168 226 164 226 L76 226 Q72 226 72 222 Z" fill="none" stroke="#004119" stroke-width="5" stroke-linejoin="round"/>

  <!-- quarter markings: full, 3/4, 1/2, 1/4 -->
  <g stroke="#004119" stroke-width="4" stroke-linecap="round">
    <line x1="66" y1="60" x2="100" y2="60"/>
    <line x1="68" y1="101" x2="90" y2="101"/>
    <line x1="69" y1="143" x2="100" y2="143"/>
    <line x1="71" y1="184" x2="90" y2="184"/>
  </g>

  <!-- orange slice on the rim -->
  <g transform="translate(176 46) rotate(20)">
    <circle r="20" fill="#f6c900"/>
    <circle r="16" fill="#ffe27a"/>
    <g stroke="#f6c900" stroke-width="2">
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="-11" y1="-11" x2="11" y2="11"/>
      <line x1="-11" y1="11" x2="11" y2="-11"/>
    </g>
  </g>
</svg>
