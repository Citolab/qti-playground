<svg xmlns="http://www.w3.org/2000/svg" width="560" height="246" viewBox="0 0 560 246" role="img" aria-label="Two horizontal boxplots on a score scale from 0 to 10. Boxplot A: the median lies in the middle of the box and both whiskers are equally long. Boxplot B: the box sits high on the scale, the median lies close to the upper edge of the box, the right whisker is short and the left whisker is very long, reaching down to about 1.">
  <rect width="560" height="246" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    <line x1="70" y1="24" x2="70" y2="196" stroke="#e2e8f0"/>
    <text x="70" y="216">0</text>
    <line x1="116" y1="24" x2="116" y2="196" stroke="#e2e8f0"/>
    <text x="116" y="216">1</text>
    <line x1="162" y1="24" x2="162" y2="196" stroke="#e2e8f0"/>
    <text x="162" y="216">2</text>
    <line x1="208" y1="24" x2="208" y2="196" stroke="#e2e8f0"/>
    <text x="208" y="216">3</text>
    <line x1="254" y1="24" x2="254" y2="196" stroke="#e2e8f0"/>
    <text x="254" y="216">4</text>
    <line x1="300" y1="24" x2="300" y2="196" stroke="#e2e8f0"/>
    <text x="300" y="216">5</text>
    <line x1="346" y1="24" x2="346" y2="196" stroke="#e2e8f0"/>
    <text x="346" y="216">6</text>
    <line x1="392" y1="24" x2="392" y2="196" stroke="#e2e8f0"/>
    <text x="392" y="216">7</text>
    <line x1="438" y1="24" x2="438" y2="196" stroke="#e2e8f0"/>
    <text x="438" y="216">8</text>
    <line x1="484" y1="24" x2="484" y2="196" stroke="#e2e8f0"/>
    <text x="484" y="216">9</text>
    <line x1="530" y1="24" x2="530" y2="196" stroke="#e2e8f0"/>
    <text x="530" y="216">10</text>
    <text x="300" y="236" fill="#1e293b">Score</text>
  </g>
  <g stroke="#0d9488" stroke-width="2.5" stroke-linecap="round">
    <line x1="139" y1="70" x2="231" y2="70"/>
    <line x1="369" y1="70" x2="461" y2="70"/>
    <line x1="139" y1="58" x2="139" y2="82"/>
    <line x1="461" y1="58" x2="461" y2="82"/>
    <rect x="231" y="46" width="138" height="48" rx="4" fill="#0d9488" fill-opacity="0.16"/>
    <line x1="300" y1="46" x2="300" y2="94" stroke-width="4"/>
  </g>
  <text x="36" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">A</text>
  <g stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round">
    <line x1="106.8" y1="150" x2="327.6" y2="150"/>
    <line x1="456.4" y1="150" x2="502.4" y2="150"/>
    <line x1="106.8" y1="138" x2="106.8" y2="162"/>
    <line x1="502.4" y1="138" x2="502.4" y2="162"/>
    <rect x="327.6" y="126" width="128.8" height="48" rx="4" fill="#4f46e5" fill-opacity="0.16"/>
    <line x1="419.6" y1="126" x2="419.6" y2="174" stroke-width="4"/>
  </g>
  <text x="36" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#4f46e5" text-anchor="middle">B</text>
</svg>
