<svg xmlns="http://www.w3.org/2000/svg" width="520" height="262" viewBox="0 0 520 262" role="img" aria-label="Bar chart of chocolate muffins sold per day for one week: Monday 6, Tuesday 4, Wednesday 5, Thursday 7, Friday 6, Saturday 8, Sunday 10. A dashed line marks the mean of about 6.57.">
  <rect width="520" height="262" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
    <line x1="64" y1="230" x2="500" y2="230" stroke="#e2e8f0"/>
    <text x="54" y="234" text-anchor="end">0</text>
    <line x1="64" y1="197.3" x2="500" y2="197.3" stroke="#e2e8f0"/>
    <text x="54" y="201.3" text-anchor="end">2</text>
    <line x1="64" y1="164.7" x2="500" y2="164.7" stroke="#e2e8f0"/>
    <text x="54" y="168.7" text-anchor="end">4</text>
    <line x1="64" y1="132" x2="500" y2="132" stroke="#e2e8f0"/>
    <text x="54" y="136" text-anchor="end">6</text>
    <line x1="64" y1="99.3" x2="500" y2="99.3" stroke="#e2e8f0"/>
    <text x="54" y="103.3" text-anchor="end">8</text>
    <line x1="64" y1="66.7" x2="500" y2="66.7" stroke="#e2e8f0"/>
    <text x="54" y="70.7" text-anchor="end">10</text>
    <line x1="64" y1="34" x2="500" y2="34" stroke="#e2e8f0"/>
    <text x="54" y="38" text-anchor="end">12</text>
    <text x="20" y="130" transform="rotate(-90 20 130)" text-anchor="middle" fill="#1e293b">Muffins sold</text>
  </g>
  <rect x="84" y="132" width="44" height="98" rx="6" fill="#b45309"/>
