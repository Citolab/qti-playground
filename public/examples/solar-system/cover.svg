<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Planets and a rocket in deep space, lit by a glowing Sun">
  <title>Journey Through the Solar System</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3466"/>
      <stop offset="1" stop-color="#0a142b"/>
    </linearGradient>
    <radialGradient id="nebula-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00b1a9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00b1a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-green" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00a748" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00a748" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.62" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#f6c900"/>
      <stop offset="1" stop-color="#f08c00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#f6c900" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f6c900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="earth"><circle cx="318" cy="150" r="34"/></clipPath>
    <clipPath id="jupiter"><circle cx="500" cy="318" r="70"/></clipPath>
    <clipPath id="saturn"><circle cx="668" cy="138" r="46"/></clipPath>
    <clipPath id="saturn-front"><rect x="560" y="138" width="220" height="60"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#space)"/>
  <circle cx="640" cy="110" r="280" fill="url(#nebula-teal)"/>
  <circle cx="300" cy="420" r="260" fill="url(#nebula-green)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="200" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="96" r="1.1" opacity="0.6"/>
    <circle cx="410" cy="60" r="1.8" opacity="0.9"/>
    <circle cx="470" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="540" cy="36" r="1.3" opacity="0.7"/>
    <circle cx="760" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="770" cy="250" r="1.2" opacity="0.7"/>
    <circle cx="720" cy="420" r="1.6" opacity="0.8"/>
    <circle cx="600" cy="420" r="1.1" opacity="0.6"/>
    <circle cx="380" cy="420" r="1.3" opacity="0.7"/>
    <circle cx="250" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="390" cy="230" r="1" opacity="0.5"/>
    <circle cx="610" cy="250" r="1" opacity="0.5"/>
    <circle cx="150" cy="420" r="1.2" opacity="0.6"/>
    <circle cx="340" cy="20" r="1" opacity="0.5"/>
    <circle cx="690" cy="330" r="1.1" opacity="0.6"/>
    <path d="M430 110 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity="0.95"/>
    <path d="M730 200 l1.6 4.8 4.8 1.6 -4.8 1.6 -1.6 4.8 -1.6 -4.8 -4.8 -1.6 4.8 -1.6z" opacity="0.9"/>
    <path d="M270 380 l1.6 4.8 4.8 1.6 -4.8 1.6 -1.6 4.8 -1.6 -4.8 -4.8 -1.6 4.8 -1.6z" opacity="0.85"/>
  </g>

  <!-- orbits around the Sun at (-90,225) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5">
    <circle cx="-90" cy="225" r="300"/>
    <circle cx="-90" cy="225" r="420"/>
    <circle cx="-90" cy="225" r="600"/>
    <circle cx="-90" cy="225" r="770"/>
    <circle cx="-90" cy="225" r="880"/>
  </g>

  <!-- Sun -->
  <circle cx="-90" cy="225" r="300" fill="url(#glow)"/>
  <circle cx="-90" cy="225" r="230" fill="url(#sun)"/>

  <!-- Earth + Moon -->
  <g clip-path="url(#earth)">
    <circle cx="318" cy="150" r="34" fill="#2e86de"/>
    <path d="M308 122 c9 -4 20 -1 22 7 c2 7 -2 11 -6 14 c-4 3 -2 8 2 12 c5 6 2 15 -6 20 c-5 3 -9 1 -9 -5 c0 -6 -5 -9 -7 -13 c-3 -5 -1 -9 3 -11 c3 -1 1 -6 -1 -9 c-3 -4 -2 -11 2 -15z" fill="#00a748"/>
    <ellipse cx="300" cy="135" rx="9" ry="2.4" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="330" cy="170" rx="10" ry="2.4" fill="#ffffff" opacity="0.8"/>
  </g>
  <circle cx="318" cy="150" r="34" fill="url(#shade)"/>
  <circle cx="366" cy="118" r="8" fill="#d9d9d9"/>
  <circle cx="366" cy="118" r="8" fill="url(#shade)"/>

  <!-- Mars -->
  <circle cx="300" cy="330" r="22" fill="#c84b1f"/>
  <ellipse cx="294" cy="336" rx="10" ry="4" fill="#93300f" opacity="0.8"/>
  <ellipse cx="300" cy="311" rx="9" ry="3" fill="#fdf2e9"/>
  <circle cx="300" cy="330" r="22" fill="url(#shade)"/>

  <!-- Jupiter -->
  <g clip-path="url(#jupiter)">
    <circle cx="500" cy="318" r="70" fill="#dcb68c"/>
    <rect x="420" y="262" width="160" height="10" fill="#b9825a"/>
    <rect x="420" y="280" width="160" height="12" fill="#f1dcc0"/>
    <rect x="420" y="298" width="160" height="10" fill="#a8683f"/>
    <rect x="420" y="314" width="160" height="14" fill="#f3e3cc"/>
    <rect x="420" y="334" width="160" height="11" fill="#c08a5e"/>
    <rect x="420" y="352" width="160" height="9" fill="#e8cfae"/>
    <rect x="420" y="366" width="160" height="11" fill="#b07650"/>
    <ellipse cx="526" cy="345" rx="16" ry="9" fill="#c4532e"/>
    <ellipse cx="526" cy="345" rx="9" ry="4.5" fill="#dd7a50"/>
  </g>
  <circle cx="500" cy="318" r="70" fill="url(#shade)"/>

  <!-- Saturn -->
  <g transform="rotate(-18 668 138)">
    <ellipse cx="668" cy="138" rx="92" ry="20" fill="none" stroke="#d8bd84" stroke-width="11"/>
    <ellipse cx="668" cy="138" rx="72" ry="15" fill="none" stroke="#f0dfb4" stroke-width="8"/>
  </g>
  <g clip-path="url(#saturn)">
    <circle cx="668" cy="138" r="46" fill="#e4c07c"/>
    <g transform="rotate(-18 668 138)">
      <rect x="610" y="108" width="116" height="8" fill="#f3dca6"/>
      <rect x="610" y="124" width="116" height="7" fill="#c9a05c"/>
      <rect x="610" y="148" width="116" height="9" fill="#f3dca6"/>
      <rect x="610" y="164" width="116" height="6" fill="#c9a05c"/>
    </g>
  </g>
  <circle cx="668" cy="138" r="46" fill="url(#shade)"/>
  <g transform="rotate(-18 668 138)" clip-path="url(#saturn-front)">
    <ellipse cx="668" cy="138" rx="92" ry="20" fill="none" stroke="#d8bd84" stroke-width="11"/>
    <ellipse cx="668" cy="138" rx="72" ry="15" fill="none" stroke="#f0dfb4" stroke-width="8"/>
  </g>

  <!-- Neptune -->
  <circle cx="726" cy="352" r="28" fill="#3567d4"/>
  <ellipse cx="726" cy="342" rx="26" ry="4" fill="#5b8cf0" opacity="0.7"/>
  <ellipse cx="734" cy="360" rx="8" ry="4.5" fill="#1d3a8a"/>
  <circle cx="726" cy="352" r="28" fill="url(#shade)"/>

  <!-- rocket with trail -->
  <path d="M290 260 C340 250 380 230 404 206" fill="none" stroke="url(#trail)" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(420 190) rotate(50) scale(0.6)">
    <path d="M-12 46 Q0 108 12 46 Z" fill="#f6c900"/>
    <path d="M-6 46 Q0 82 6 46 Z" fill="#fff4b8"/>
    <rect x="-15" y="38" width="30" height="10" rx="3" fill="#004119"/>
    <path d="M-22 6 L-44 40 L-44 54 L-22 42 Z" fill="#00a748"/>
    <path d="M22 6 L44 40 L44 54 L22 42 Z" fill="#00a748"/>
    <path d="M0 -76 C24 -54 28 -12 22 42 L-22 42 C-28 -12 -24 -54 0 -76 Z" fill="#ffffff"/>
    <path d="M0 -76 C24 -54 28 -12 22 42 L10 42 C14 -10 12 -50 0 -76 Z" fill="#dfe8ef"/>
    <path d="M0 -76 C12 -66 18 -54 21 -42 L-21 -42 C-18 -54 -12 -66 0 -76 Z" fill="#00a748"/>
    <circle cx="0" cy="-12" r="13" fill="#004119"/>
    <circle cx="0" cy="-12" r="9" fill="#00b1a9"/>
    <circle cx="-3" cy="-15" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
