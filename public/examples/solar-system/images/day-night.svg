<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-label="Sunlight shines on one half of the spinning Earth while the other half is in darkness">
  <title>Sunlight falling on the spinning Earth</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f3a70"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.6" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.5" stop-color="#f6c900"/>
      <stop offset="1" stop-color="#f08c00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#f6c900" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f6c900" stop-opacity="0"/>
    </radialGradient>
    <marker id="ray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f6c900"/>
    </marker>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050b1c" stop-opacity="0.35"/>
      <stop offset="0.18" stop-color="#050b1c" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="frame"><rect width="520" height="260" rx="22"/></clipPath>
    <clipPath id="earth"><circle cx="380" cy="130" r="90"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="520" height="260" fill="url(#space)"/>
    <g fill="#ffffff">
      <circle cx="490" cy="30" r="1.4" opacity="0.8"/>
      <circle cx="500" cy="200" r="1.2" opacity="0.7"/>
      <circle cx="478" cy="236" r="1" opacity="0.6"/>
      <circle cx="270" cy="22" r="1" opacity="0.5"/>
      <circle cx="250" cy="240" r="1.1" opacity="0.5"/>
      <path d="M496 110 l1.4 4 4 1.4 -4 1.4 -1.4 4 -1.4 -4 -4 -1.4 4 -1.4z" opacity="0.9"/>
    </g>

    <!-- sunlight -->
    <g stroke="#f6c900" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10" marker-end="url(#ray)">
      <line x1="118" y1="62" x2="292" y2="62"/>
      <line x1="122" y1="96" x2="282" y2="96"/>
      <line x1="124" y1="130" x2="278" y2="130"/>
      <line x1="122" y1="164" x2="282" y2="164"/>
      <line x1="118" y1="198" x2="292" y2="198"/>
    </g>

    <!-- Sun -->
    <circle cx="30" cy="130" r="120" fill="url(#glow)"/>
    <circle cx="30" cy="130" r="74" fill="url(#sun)"/>

    <!-- Earth -->
    <g clip-path="url(#earth)">
      <circle cx="380" cy="130" r="90" fill="#2e86de"/>
      <path d="M352 52 c22 -10 46 -6 54 10 c8 15 -2 26 -14 32 c-10 6 -5 18 5 28 c12 14 5 38 -14 52 c-12 8 -22 3 -22 -10 c0 -14 -10 -20 -17 -30 c-7 -12 -3 -22 7 -26 c8 -3 3 -14 -3 -20 c-7 -10 -5 -28 4 -36z" fill="#00a748"/>
      <path d="M296 104 c14 -8 30 2 33 16 c3 15 -7 26 -18 32 c-10 5 -19 -3 -19 -15z" fill="#00a748"/>
      <path d="M420 150 c10 -5 24 0 24 10 c0 11 -10 17 -20 14 c-7 -3 -10 -17 -4 -24z" fill="#2fbf68"/>
      <ellipse cx="380" cy="214" rx="54" ry="12" fill="#f4fbff"/>
      <ellipse cx="330" cy="76" rx="22" ry="5" fill="#ffffff" opacity="0.85"/>
      <ellipse cx="420" cy="104" rx="24" ry="5" fill="#ffffff" opacity="0.8"/>
      <ellipse cx="350" cy="182" rx="20" ry="4" fill="#ffffff" opacity="0.75"/>
      <!-- night side -->
      <rect x="380" y="30" width="100" height="200" fill="url(#night)"/>
      <!-- city lights on the night side -->
      <g fill="#ffe27a">
        <circle cx="396" cy="78" r="1.6"/>
        <circle cx="402" cy="84" r="1.2"/>
        <circle cx="430" cy="160" r="1.6"/>
        <circle cx="436" cy="166" r="1.2"/>
        <circle cx="424" cy="168" r="1.2"/>
        <circle cx="390" cy="140" r="1.4"/>
      </g>
    </g>
    <circle cx="380" cy="130" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <!-- axis and spin -->
    <line x1="364" y1="22" x2="396" y2="238" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
    <path d="M326 46 Q380 74 438 44" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
</svg>
