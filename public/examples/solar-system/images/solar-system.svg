<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="The Sun on the left with the eight planets on their orbits">
  <title>The Sun and the eight planets</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2f5c"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff4b8"/>
      <stop offset="0.45" stop-color="#f6c900"/>
      <stop offset="1" stop-color="#f08c00"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#f6c900" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6c900" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="720" height="300" rx="22"/></clipPath>
    <clipPath id="jupiter"><circle cx="310" cy="88" r="34"/></clipPath>
    <clipPath id="saturn"><circle cx="423" cy="232" r="25"/></clipPath>
    <clipPath id="earth"><circle cx="198" cy="117" r="12"/></clipPath>
    <clipPath id="saturn-front"><rect x="363" y="232" width="120" height="40"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="300" fill="url(#space)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="150" cy="30" r="1.4" opacity="0.8"/>
      <circle cx="232" cy="48" r="1" opacity="0.6"/>
      <circle cx="262" cy="170" r="1.3" opacity="0.7"/>
      <circle cx="248" cy="282" r="1.1" opacity="0.6"/>
      <circle cx="372" cy="36" r="1.5" opacity="0.8"/>
      <circle cx="388" cy="140" r="1" opacity="0.5"/>
      <circle cx="350" cy="268" r="1.2" opacity="0.7"/>
      <circle cx="458" cy="88" r="1.3" opacity="0.7"/>
      <circle cx="486" cy="168" r="1" opacity="0.6"/>
      <circle cx="510" cy="276" r="1.5" opacity="0.8"/>
      <circle cx="584" cy="140" r="1.2" opacity="0.7"/>
      <circle cx="600" cy="38" r="1" opacity="0.6"/>
      <circle cx="676" cy="118" r="1.4" opacity="0.8"/>
      <circle cx="690" cy="262" r="1.1" opacity="0.6"/>
      <circle cx="560" cy="226" r="0.9" opacity="0.5"/>
      <circle cx="120" cy="270" r="1.2" opacity="0.6"/>
      <circle cx="176" cy="196" r="0.9" opacity="0.5"/>
      <circle cx="430" cy="160" r="0.9" opacity="0.5"/>
      <path d="M262 236 l1.4 4 4 1.4 -4 1.4 -1.4 4 -1.4 -4 -4 -1.4 4 -1.4z" opacity="0.9"/>
      <path d="M560 70 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2z" opacity="0.8"/>
    </g>

    <!-- comet -->
    <path d="M628 48 L690 26" stroke="url(#comet)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="690" cy="26" r="3" fill="#ffffff"/>

    <!-- orbits (centred on the Sun at -40,150) -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2">
      <circle cx="-40" cy="150" r="165"/>
      <circle cx="-40" cy="150" r="200"/>
      <circle cx="-40" cy="150" r="240"/>
      <circle cx="-40" cy="150" r="277"/>
      <circle cx="-40" cy="150" r="355"/>
      <circle cx="-40" cy="150" r="470"/>
      <circle cx="-40" cy="150" r="575"/>
      <circle cx="-40" cy="150" r="665"/>
    </g>

    <!-- Sun -->
    <circle cx="-40" cy="150" r="168" fill="url(#glow)"/>
    <circle cx="-40" cy="150" r="130" fill="url(#sun)"/>
    <circle cx="40" cy="110" r="10" fill="#fff4b8" opacity="0.35"/>
    <circle cx="62" cy="182" r="6" fill="#f08c00" opacity="0.35"/>

    <!-- Mercury -->
    <circle cx="115" cy="94" r="7" fill="#a7a29a"/>
    <circle cx="113" cy="92" r="1.8" fill="#8c877f"/>
    <circle cx="115" cy="94" r="7" fill="url(#shade)"/>

    <!-- Venus -->
    <circle cx="141" cy="235" r="11" fill="#e6c27a"/>
    <ellipse cx="141" cy="232" rx="10" ry="2.2" fill="#f3dca6" opacity="0.9"/>
    <ellipse cx="141" cy="239" rx="9" ry="1.8" fill="#d3a45e" opacity="0.6"/>
    <circle cx="141" cy="235" r="11" fill="url(#shade)"/>

    <!-- Earth and Moon -->
    <g clip-path="url(#earth)">
      <circle cx="198" cy="117" r="12" fill="#2e86de"/>
      <path d="M194 107 c4 -2 9 0 9 4 c0 3 -3 4 -2 7 c1 3 -1 7 -5 7 c-3 0 -3 -4 -5 -6 c-2 -3 -1 -6 1 -7 c2 -1 1 -3 2 -5z" fill="#00a748"/>
      <ellipse cx="205" cy="121" rx="4" ry="1.2" fill="#ffffff" opacity="0.85"/>
    </g>
    <circle cx="198" cy="117" r="12" fill="url(#shade)"/>
    <circle cx="217" cy="102" r="3" fill="#d6d6d6"/>

    <!-- Mars -->
    <circle cx="223" cy="236" r="9" fill="#c84b1f"/>
    <ellipse cx="221" cy="238" rx="4" ry="1.8" fill="#93300f" opacity="0.8"/>
    <ellipse cx="223" cy="228.5" rx="4" ry="1.4" fill="#fdf2e9"/>
    <circle cx="223" cy="236" r="9" fill="url(#shade)"/>

    <!-- Jupiter -->
    <g clip-path="url(#jupiter)">
      <circle cx="310" cy="88" r="34" fill="#dcb68c"/>
      <rect x="270" y="62" width="80" height="5" fill="#b9825a"/>
      <rect x="270" y="71" width="80" height="6" fill="#f1dcc0"/>
      <rect x="270" y="80" width="80" height="5" fill="#a8683f"/>
      <rect x="270" y="88" width="80" height="7" fill="#f3e3cc"/>
      <rect x="270" y="98" width="80" height="6" fill="#c08a5e"/>
      <rect x="270" y="107" width="80" height="5" fill="#e8cfae"/>
      <rect x="270" y="114" width="80" height="6" fill="#b07650"/>
      <ellipse cx="322" cy="101" rx="8" ry="4.5" fill="#c4532e"/>
    </g>
    <circle cx="310" cy="88" r="34" fill="url(#shade)"/>

    <!-- Saturn: back of the rings, planet, then the front of the rings -->
    <g transform="rotate(-16 423 232)">
      <ellipse cx="423" cy="232" rx="50" ry="11" fill="none" stroke="#d8bd84" stroke-width="6"/>
      <ellipse cx="423" cy="232" rx="39" ry="8" fill="none" stroke="#f0dfb4" stroke-width="4"/>
    </g>
    <g clip-path="url(#saturn)">
      <circle cx="423" cy="232" r="25" fill="#e4c07c"/>
      <g transform="rotate(-16 423 232)">
        <rect x="390" y="216" width="66" height="4" fill="#f3dca6"/>
        <rect x="390" y="225" width="66" height="4" fill="#c9a05c"/>
        <rect x="390" y="240" width="66" height="5" fill="#f3dca6"/>
      </g>
    </g>
    <circle cx="423" cy="232" r="25" fill="url(#shade)"/>
    <g transform="rotate(-16 423 232)" clip-path="url(#saturn-front)">
      <ellipse cx="423" cy="232" rx="50" ry="11" fill="none" stroke="#d8bd84" stroke-width="6"/>
      <ellipse cx="423" cy="232" rx="39" ry="8" fill="none" stroke="#f0dfb4" stroke-width="4"/>
    </g>

    <!-- Uranus with its faint, almost upright ring -->
    <circle cx="531" cy="80" r="18" fill="#9fe3e6"/>
    <ellipse cx="531" cy="74" rx="17" ry="3" fill="#c4f0f1" opacity="0.7"/>
    <circle cx="531" cy="80" r="18" fill="url(#shade)"/>
    <ellipse cx="531" cy="80" rx="5" ry="27" fill="none" stroke="#cdeff0" stroke-opacity="0.45" stroke-width="1.6" transform="rotate(12 531 80)"/>

    <!-- Neptune -->
    <circle cx="621" cy="220" r="17" fill="#3567d4"/>
    <ellipse cx="621" cy="214" rx="16" ry="2.4" fill="#5b8cf0" opacity="0.7"/>
    <ellipse cx="626" cy="224" rx="5" ry="3" fill="#1d3a8a"/>
    <circle cx="621" cy="220" r="17" fill="url(#shade)"/>
  </g>
</svg>
